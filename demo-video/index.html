<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #ededE6;
        --ink: #121212;
        --accent: #ffd60a;
        --pink: #ff9ecf;
        --sky: #9cc5ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="44" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="input" data-composition-id="input" data-composition-src="compositions/input.html" data-start="5.6" data-duration="5.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="drafting" data-composition-id="drafting" data-composition-src="compositions/drafting.html" data-start="10.9" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="brief" data-composition-id="brief" data-composition-src="compositions/brief.html" data-start="16.9" data-duration="20.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="37" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="44" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index: 10"></div>

      <audio id="vo" src="assets/voiceover-el.wav" data-start="0" data-duration="44" data-track-index="3" data-volume="1"></audio>

      <!-- every effect has a cause on screen -->
      <audio id="sfx-hook-hit" src="assets/sfx/impact-bass-1.mp3" data-start="3.04" data-duration="1.2" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-wipe-1" src="assets/sfx/whoosh-short.mp3" data-start="5.25" data-duration="0.57" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-click-chip" src="assets/sfx/click.mp3" data-start="7.2" data-duration="0.37" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-click-start" src="assets/sfx/click.mp3" data-start="9.9" data-duration="0.37" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-cut-brief" src="assets/sfx/whoosh.mp3" data-start="16.75" data-duration="0.57" data-track-index="5" data-volume="0.35"></audio>
      <audio id="sfx-pop-score" src="assets/sfx/pop.mp3" data-start="20.65" data-duration="0.6" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-click-market" src="assets/sfx/click-soft.mp3" data-start="22.56" data-duration="0.37" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-click-fin" src="assets/sfx/click.mp3" data-start="27.9" data-duration="0.37" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-pop-tag" src="assets/sfx/pop.mp3" data-start="31.5" data-duration="0.6" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-click-land" src="assets/sfx/click-soft.mp3" data-start="33.5" data-duration="0.37" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-wipe-2" src="assets/sfx/whoosh-short.mp3" data-start="36.65" data-duration="0.57" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-riser" src="assets/sfx/riser.mp3" data-start="38.53" data-media-start="1.5" data-duration="2.8" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-logo-hit" src="assets/sfx/impact-bass-1.mp3" data-start="40.5" data-duration="1.2" data-track-index="4" data-volume="0.4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
